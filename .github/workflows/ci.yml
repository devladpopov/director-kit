name: ci
on: [push, pull_request]
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}' }
      - run: node test/smoke.mjs
      - name: install from a clean folder, like a new user
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/Projects/hello" && cd "$RUNNER_TEMP/Projects/hello" && git init -q && git -c user.email=a@b -c user.name=a commit -q --allow-empty -m hi
          cd "$RUNNER_TEMP" && npx -y "$GITHUB_WORKSPACE" --root="$RUNNER_TEMP/Projects" --no-open --yes
          test -f "$HOME/.director-kit/board.html"
